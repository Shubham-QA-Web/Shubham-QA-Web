<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#151a3d"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <linearGradient id="flashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4c430" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f4c430" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="chakraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="50%" stop-color="#f4c430"/>
      <stop offset="100%" stop-color="#ff9d3d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bgGrad)"/>

  <!-- starry chakra particles -->
  <g fill="#f4c430">
    <circle cx="80" cy="40" r="1.6" opacity="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="170" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="30" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="150" r="1.8" opacity="0.7"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="20" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- chakra glow behind kunai -->
  <circle cx="120" cy="110" r="90" fill="url(#chakraGlow)">
    <animate attributeName="r" values="80;100;80" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Flying Thunder God kunai (stylized) -->
  <g transform="translate(120,110) rotate(-20)">
    <rect x="-6" y="-55" width="12" height="70" rx="3" fill="#cfd8e3"/>
    <polygon points="-6,-55 6,-55 0,-80" fill="#e6ecf3"/>
    <rect x="-3" y="15" width="6" height="30" fill="#5a4632"/>
    <circle cx="0" cy="50" r="5" fill="#f4c430"/>
    <animateTransform attributeName="transform" type="rotate" values="-20 120 110; -14 120 110; -20 120 110" dur="4s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- lightning-flash streak -->
  <rect x="0" y="108" width="1200" height="2" fill="url(#flashGrad)">
    <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Main title -->
  <text x="270" y="95" font-family="Verdana, sans-serif" font-size="46" font-weight="bold" fill="url(#textGrad)">
    Shubham Suryawanshi
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="270" y="135" font-family="Verdana, sans-serif" font-size="21" fill="#9fd8ff" letter-spacing="1">
    Software Test Engineer ⚡ Flying Thunder God of QA
  </text>
  <text x="270" y="165" font-family="Verdana, sans-serif" font-size="14" fill="#8892b0">
    Konoha's Fastest Bug Hunter · Automation · Manual · API Testing
  </text>

  <!-- right side rasengan-esque swirl -->
  <g transform="translate(1080,110)">
    <circle r="42" fill="none" stroke="#4fc3f7" stroke-width="3" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="28" fill="none" stroke="#f4c430" stroke-width="2.5" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="10" fill="#eaf6ff" opacity="0.85">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
