<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e6"/>
      <stop offset="50%" stop-color="#ffefc4"/>
      <stop offset="100%" stop-color="#fff8e6"/>
    </linearGradient>
    <radialGradient id="chakraGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e08e00"/>
      <stop offset="50%" stop-color="#d9822a"/>
      <stop offset="100%" stop-color="#c9600f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bgGradL)"/>

  <circle cx="120" cy="110" r="90" fill="url(#chakraGlowL)">
    <animate attributeName="r" values="80;100;80" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(120,110) rotate(-20)">
    <rect x="-6" y="-55" width="12" height="70" rx="3" fill="#8a97a8"/>
    <polygon points="-6,-55 6,-55 0,-80" fill="#c2cbd6"/>
    <rect x="-3" y="15" width="6" height="30" fill="#5a4632"/>
    <circle cx="0" cy="50" r="5" fill="#e08e00"/>
    <animateTransform attributeName="transform" type="rotate" values="-20 120 110; -14 120 110; -20 120 110" dur="4s" repeatCount="indefinite" additive="sum"/>
  </g>

  <text x="270" y="95" font-family="Verdana, sans-serif" font-size="46" font-weight="bold" fill="url(#textGradL)">
    Shubham Suryawanshi
  </text>
  <text x="270" y="135" font-family="Verdana, sans-serif" font-size="21" fill="#0b6fa8" letter-spacing="1">
    Software Test Engineer ⚡ Flying Thunder God of QA
  </text>
  <text x="270" y="165" font-family="Verdana, sans-serif" font-size="14" fill="#6b5b3d">
    Konoha's Fastest Bug Hunter · Automation · Manual · API Testing
  </text>

  <g transform="translate(1080,110)">
    <circle r="42" fill="none" stroke="#4fc3f7" stroke-width="3" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="28" fill="none" stroke="#e08e00" stroke-width="2.5" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="10" fill="#fff6e0" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
