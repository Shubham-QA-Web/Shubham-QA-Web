<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#070B14"/>
    <stop offset="1" stop-color="#101827"/>
  </linearGradient>
  <linearGradient id="cyan" x1="180" y1="100" x2="1000" y2="430" gradientUnits="userSpaceOnUse">
    <stop stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#60A5FA"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#34D399"/>
    <stop offset="1" stop-color="#22C55E"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" stroke="#334155" stroke-opacity=".16"/>
  </pattern>
  <clipPath id="screen"><rect x="82" y="280" width="1036" height="172" rx="16"/></clipPath>
</defs>

<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<rect width="1200" height="520" rx="28" fill="url(#grid)"/>

<circle cx="930" cy="80" r="150" fill="#22D3EE" opacity=".08" filter="url(#soft)">
  <animate attributeName="r" values="140;175;140" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="180" cy="460" r="120" fill="#3B82F6" opacity=".07" filter="url(#soft)"/>

