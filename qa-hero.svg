<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shubham Suryawanshi — Software Test Engineer</title>
  <desc id="desc">Premium terminal-inspired QA engineering hero showing automation, API validation, regression testing and defect analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B10"/>
      <stop offset="1" stop-color="#0D141C"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="110" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
      .sans{font-family:Inter,Arial,sans-serif}
      .cursor{animation:blink 1s steps(1,end) infinite}
      .scan{animation:scan 4s ease-in-out infinite}
      @keyframes blink{50%{opacity:0}}
      @keyframes scan{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(250px);opacity:.5}}
      @media (prefers-reduced-motion:reduce){.cursor,.scan{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="558" rx="23" stroke="#1E2934"/>

  <!-- subtle grid -->
  <g opacity=".12" stroke="#22D3EE">
    <path d="M80 0V560M200 0V560M320 0V560M440 0V560M560 0V560M680 0V560M800 0V560M920 0V560M1040 0V560M1160 0V560"/>
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200"/>
  </g>

  <!-- header -->
  <rect x="36" y="30" width="1128" height="54" rx="12" fill="#0A1118" stroke="#1E2B36"/>
  <circle cx="61" cy="57" r="6" fill="#22D3EE" filter="url(#glow)"/>
  <text x="80" y="63" class="mono" font-size="16" fill="#A8B6C3">QA_ENGINE v3.2</text>
  <text x="1018" y="63" class="mono" font-size="14" fill="#7C8A96">● ONLINE</text>

  <!-- identity -->
  <text x="72" y="166" class="sans" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">SHUBHAM SURYAWANSHI</text>
  <text x="75" y="202" class="mono" font-size="19" letter-spacing="2.5" fill="#22D3EE">SOFTWARE TEST ENGINEER</text>

  <!-- terminal -->
  <rect x="72" y="238" width="690" height="214" rx="14" fill="#080D12" stroke="#1C2A35"/>
  <text x="98" y="276" class="mono" font-size="16" fill="#6E7E8C">&gt; initializing automation suite...</text>
  <text x="698" y="276" class="mono" font-size="16" fill="#4ADE80">✓</text>
  <text x="98" y="315" class="mono" font-size="16" fill="#6E7E8C">&gt; API validation...................</text>
  <text x="698" y="315" class="mono" font-size="16" fill="#4ADE80">✓</text>
  <text x="98" y="354" class="mono" font-size="16" fill="#6E7E8C">&gt; regression testing...............</text>
  <text x="698" y="354" class="mono" font-size="16" fill="#4ADE80">✓</text>
  <text x="98" y="393" class="mono" font-size="16" fill="#6E7E8C">&gt; defect analysis.................</text>
  <text x="698" y="393" class="mono" font-size="16" fill="#4ADE80">✓</text>
  <text x="98" y="430" class="mono" font-size="16" fill="#22D3EE">&gt; status: ready_to_ship<span class="cursor">_</span></text>

  <!-- right stats -->
  <rect x="790" y="238" width="338" height="214" rx="14" fill="#0A1118" stroke="#1C2A35"/>
  <text x="820" y="276" class="mono" font-size="13" fill="#60707E">CORE_CAPABILITIES</text>
  <text x="820" y="315" class="mono" font-size="16" fill="#E5E7EB">AUTOMATION</text>
  <text x="1085" y="315" class="mono" font-size="16" text-anchor="end" fill="#22D3EE">PLAYWRIGHT</text>
  <text x="820" y="350" class="mono" font-size="16" fill="#E5E7EB">UI TESTING</text>
  <text x="1085" y="350" class="mono" font-size="16" text-anchor="end" fill="#22D3EE">SELENIUM</text>
  <text x="820" y="385" class="mono" font-size="16" fill="#E5E7EB">API TESTING</text>
  <text x="1085" y="385" class="mono" font-size="16" text-anchor="end" fill="#22D3EE">POSTMAN</text>
  <text x="820" y="420" class="mono" font-size="16" fill="#E5E7EB">BDD</text>
  <text x="1085" y="420" class="mono" font-size="16" text-anchor="end" fill="#22D3EE">CUCUMBER</text>

  <!-- pipeline -->
  <rect x="72" y="482" width="1056" height="1" fill="url(#cyanLine)"/>
  <text x="600" y="520" class="mono" font-size="15" text-anchor="middle" letter-spacing="2" fill="#CBD5E1">
    TEST  →  AUTOMATE  →  DEBUG  →  VERIFY  →  SHIP
  </text>

  <!-- subtle scan -->
  <rect class="scan" x="72" y="238" width="1056" height="1" fill="#22D3EE"/>
</svg>
