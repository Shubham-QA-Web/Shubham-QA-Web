<rect x="82" y="280" width="1036" height="172" rx="16" fill="#050914" stroke="#334155"/>
<rect x="82" y="280" width="1036" height="34" rx="16" fill="#0B1220"/>
<circle cx="106" cy="297" r="5" fill="#EF4444"/>
<circle cx="124" cy="297" r="5" fill="#F59E0B"/>
<circle cx="142" cy="297" r="5" fill="#22C55E"/>
<text x="168" y="303" fill="#64748B" font-family="monospace" font-size="13">automation-suite</text>

